name: Update Technology Stack

on:
  workflow_dispatch:

  schedule:
    # Jalan setiap 30 menit
    - cron: "*/30 * * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "generated/**"
      - "README.md"

permissions:
  contents: write

# Mencegah dua workflow jalan bersamaan
concurrency:
  group: update-tech-stack
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Tech Stack
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================================================
      # SYNC DENGAN REMOTE SEBELUM GENERATE
      # ==================================================

      - name: Sync with latest main
        run: |
          git config pull.rebase true
          git pull --rebase origin main

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ==================================================
      # GENERATE
      # ==================================================

      - name: Generate technology statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate-tech-stack.py

      # ==================================================
      # COMMIT & PUSH
      # ==================================================

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/ README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update technology statistics"

          git push origin HEAD:main
